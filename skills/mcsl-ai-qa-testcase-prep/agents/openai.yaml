display_name: MCSL AI QA Testcase Prep
short_description: Turn a Trello card or feature story into detailed MCSL test cases with platform-aware steps. Default to Shopify when no platform is explicit.
default_prompt: Read this Trello card or feature request, use the MCSL Domain Expert project knowledge plus existing automation patterns, and generate detailed AI QA Agent-ready test cases for Chrome verification, not Trello or CSV publishing.
