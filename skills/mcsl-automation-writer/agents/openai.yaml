display_name: MCSL Automation Writer
short_description: Generate Playwright automation from approved MCSL US/AC, TCs, AI QA evidence, and saved locator traces.
default_prompt: Generate Playwright automation for this MCSL card by reusing existing POM locators/methods first, manually inspecting Chrome or saved AI QA locator traces for DOM certainty, and following the dashboard automation writer style. If the card is explicitly WooCommerce, BigCommerce, Magento, or PrestaShop, ask QA before covering the shared behavior through the current Shopify/MCSL automation flow.
